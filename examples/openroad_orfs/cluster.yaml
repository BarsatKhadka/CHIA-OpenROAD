# Minimal CHIA cluster for the ORFS backend: one machine acting as both head
# and worker. Enough to exercise CHIA's bring-up (container start, ray start
# inside it, resource declaration) without committing to a worker shape — the
# real sizing needs the medium design's memory high-water mark, which we do not
# have yet. chameleon's DRC alone peaked at 9.2 GB.
#
#   chia up examples/openroad_orfs/cluster.yaml
#   chia status
#   chia down examples/openroad_orfs/cluster.yaml
#
# Scaling later means raising num_workers and listing more IPs (or adding a
# gcp_nodes: section so CHIA provisions them itself).

cluster_name: chia_openroad

available_node_types:
    orfs_worker:
        # A slot is one candidate. The node divides NUM_CORES by the slot
        # count, so on a 32-vCPU machine 16 slots means 2 threads per candidate.
        #
        # Sixteen rather than eight because NUM_CORES is a ceiling, not a
        # reservation: a build in synthesis or floorplanning uses one thread
        # whatever it was given, and with only eight in flight the machine sat
        # at a load of 18-21 out of 32. More candidates in flight means more of
        # them are in the routing phase at any moment, which is the part that
        # actually uses its threads. The project is capped at 32 vCPUs globally
        # by CPUS_ALL_REGIONS, so throughput has to come from filling the
        # machine rather than from adding cores. An earlier 4-vCPU run with 4 slots gave every
        # candidate 4 threads, drove load to 12.9, and made each ~3x slower.
        resources: {"orfs": 16}
        num_workers: 1
        compatible_ips: ["10.138.0.2"]
        docker:
            image: "chia-orfs:latest"
            container_name: "chia-orfs-${USER}"
            # The image is built on the machine, not in a registry. Pulling
            # would fail; there is nothing to pull from.
            pull_before_run: False
            run_options:
                # Ray's object store lives in /dev/shm; Docker's 64 MB default
                # makes the raylet fail to start. Ray wants ~30% of RAM.
                - --shm-size=16g

auth:
    ssh_user: barsat

provider:
    head_ip: 10.138.0.2

# The head runs on the HOST, so it needs conda's ray by absolute path.
# The dashboard stays ON: `chia job submit` (which CHIA forwards to Ray) talks
# to the dashboard's HTTP API on 8265, so disabling it makes the documented way
# of running a CHIA workload fail with a bare
#   ConnectionError: Failed to connect to Ray at address: http://127.0.0.1:8265
# --dashboard-host=127.0.0.1 keeps it loopback-only, so nothing is exposed.
head_start_ray_commands:
    - "/opt/conda/envs/chia_env/bin/ray stop"
    - "/opt/conda/envs/chia_env/bin/ray start --head --port=6379 --dashboard-host=127.0.0.1 --dashboard-port=8265 --dashboard-agent-listen-port=0"

# These run INSIDE the container (docker exec ... bash --login), where the
# image already puts chia_env's bin on PATH.
worker_start_ray_commands:
    - "ray stop"
    - "ray start --address=$RAY_HEAD_IP:6379 --dashboard-agent-listen-port=0"
